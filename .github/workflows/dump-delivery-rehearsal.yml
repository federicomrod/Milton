# .github/workflows/dump-delivery-rehearsal.yml
#
# Practice run: prove encrypt/upload/download/decrypt works with NO production
# access and NO secrets. Uses a dummy text file and reads the public key from
# .github/dump-delivery-rehearsal. The key-check, encrypt and upload steps are
# byte-identical copies of prod-schema-dump.yml's steps (except for the key
# file path and artifact name).

name: Dump delivery rehearsal (practice, no prod access)

on:
  push:
    branches: [r1-db-baseline]
    paths: [.github/dump-delivery-rehearsal]
  workflow_dispatch:

permissions: {}

jobs:
  rehearsal:
    name: Practice encrypt/upload with dummy data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Load and validate the encryption public key (before touching production)
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          keyfile="$RUNNER_TEMP/recipient.asc"
          gnupghome="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$gnupghome"
          export GNUPGHOME="$gnupghome"

          # The key file as committed at exactly this run's commit. No
          # checkout and no token: the repository is public.
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/dump-delivery-rehearsal"
          curl --fail --silent --show-error \
               --proto '=https' --tlsv1.2 --max-time 30 --max-filesize 20000 \
               --retry 5 --retry-delay 3 --retry-all-errors \
               --output "$keyfile" "$url" \
            || fail ".github/dump-delivery-rehearsal is missing at commit ${GITHUB_SHA} (or could not be fetched)."

          [ -s "$keyfile" ] || fail ".github/dump-delivery-rehearsal is empty."
          if grep -q 'PRIVATE KEY BLOCK' "$keyfile"; then
            fail ".github/dump-delivery-rehearsal contains a PRIVATE key block. Remove it from history and rotate the key."
          fi
          [ "$(grep -c -- '-----BEGIN PGP PUBLIC KEY BLOCK-----' "$keyfile")" = "1" ] \
            || fail ".github/dump-delivery-rehearsal must contain exactly one armored OpenPGP public key block."

          colons="$(gpg --batch --with-colons --show-keys "$keyfile" 2>/dev/null)" \
            || fail ".github/dump-delivery-rehearsal is not a valid OpenPGP key."
          [ "$(printf '%s\n' "$colons" | grep -c '^pub:')" = "1" ] \
            || fail ".github/dump-delivery-rehearsal must hold exactly one public key."
          validity="$(printf '%s\n' "$colons" | awk -F: '$1=="pub"{print $2; exit}')"
          case "$validity" in r|e) fail "the public key is revoked or expired." ;; esac
          fpr="$(printf '%s\n' "$colons" | awk -F: '$1=="fpr"{print $10; exit}')"
          [[ "$fpr" =~ ^[0-9A-F]{40,64}$ ]] || fail "could not read the key fingerprint."

          # Import, then prove the key can actually encrypt.
          gpg --batch --quiet --import "$keyfile" 2>/dev/null \
            || fail "could not import the public key."
          printf 'probe' | gpg --batch --yes --quiet --trust-model always \
              --recipient "$fpr" --encrypt --output "$RUNNER_TEMP/probe.gpg" 2>/dev/null \
            || fail "the public key cannot be used for encryption."
          rm -f "$RUNNER_TEMP/probe.gpg"

          echo "::notice::Encrypting to OpenPGP key fingerprint: ${fpr}"
          # Later steps use this keyring (public info only; no private key).
          { echo "GNUPGHOME=$gnupghome"; echo "RECIPIENT_FPR=$fpr"; } >> "$GITHUB_ENV"

      - name: Generate dummy data (replaces pg_dump)
        shell: bash
        run: |
          set -euo pipefail
          f=baseline_raw.sql
          {
            echo "-- Milton rehearsal schema dump (dummy data, no production access)"
            echo "-- Generated at: 2026-10-05"
            echo ""
            echo "CREATE TABLE restaurants ("
            echo "  id uuid PRIMARY KEY,"
            echo "  name text NOT NULL"
            echo ");"
            echo ""
            echo "CREATE TABLE menu_items ("
            echo "  id uuid PRIMARY KEY,"
            echo "  restaurant_id uuid REFERENCES restaurants(id)"
            echo ");"
            echo ""
            echo "CREATE POLICY \"restaurants_select\" ON restaurants FOR SELECT TO authenticated;"
            echo "CREATE POLICY \"menu_items_select\" ON menu_items FOR SELECT TO authenticated;"
            echo ""
            echo "CREATE FUNCTION get_restaurant_count() RETURNS bigint AS \$\$"
            echo "  SELECT count(*) FROM restaurants;"
            echo "\$\$ LANGUAGE sql;"
            echo ""
            echo "GRANT SELECT ON restaurants TO authenticated;"
            echo "GRANT SELECT ON menu_items TO authenticated;"
          } > "$f"
          echo "dummy data generated: $(wc -l < "$f") lines"

      - name: Validate dump and scan plaintext for secrets
        shell: bash
        run: |
          set -euo pipefail
          f=baseline_raw.sql
          [ -s "$f" ] || { echo "::error::dump is empty"; rm -f "$f"; exit 1; }
          grep -q '^CREATE TABLE ' "$f" || { echo "::error::dump contains no CREATE TABLE"; rm -f "$f"; exit 1; }

          # A schema-only dump must contain no row data at all. Only line
          # numbers are printed, never content.
          if grep -Eq '^(COPY|INSERT INTO)([[:space:]]|$)' "$f"; then
            echo "::error::dump contains row data (a line starting with COPY or INSERT INTO) at line(s): $(grep -nE '^(COPY|INSERT INTO)([[:space:]]|$)' "$f" | cut -d: -f1 | head -5 | tr '\n' ' ')"
            rm -f "$f"
            exit 1
          fi

          # Matches are never printed, only the name of the pattern.
          hits=0
          scan() { # name, grep flags, ERE
            if grep "$2" -q -- "$3" "$f"; then
              echo "::error::secret scan hit: $1"
              hits=$((hits + 1))
            fi
          }
          scan "database URL"           -Ei 'postgres(ql)?://'
          scan "JWT (eyJ...)"           -E  'eyJ[A-Za-z0-9_-]{10,}'
          scan "sb_secret_ key"         -E  'sb_secret_'
          scan "sk_live key"            -E  'sk_live'
          scan "private key block"      -E  '-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----'
          scan "password literal (=)"   -Ei "password[[:space:]]*(=|:|=>)[[:space:]]*'+[^']+'+"
          scan "password literal (SQL)" -Ei "password[[:space:]]+'+[^']+'+"
          if [ "$hits" -gt 0 ]; then
            rm -f "$f"
            echo "::error::$hits secret-scan pattern(s) matched; nothing will be uploaded."
            exit 1
          fi

          # Counts only, no content.
          echo "dump OK: $(wc -l < "$f") lines;" \
            "tables=$(grep -c '^CREATE TABLE ' "$f")" \
            "policies=$(grep -c '^CREATE POLICY ' "$f")" \
            "functions=$(grep -c '^CREATE FUNCTION ' "$f")" \
            "grants=$(grep -c '^GRANT ' "$f")"

      - name: Encrypt the dump and delete the plaintext
        shell: bash
        run: |
          set -euo pipefail
          f=baseline_raw.sql
          out=baseline_raw.sql.gpg
          # On any failure leave neither file behind.
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then rm -f -- "$f" "$out"; fi' EXIT

          [ -n "${RECIPIENT_FPR:-}" ] || { echo "::error::no recipient key was loaded"; exit 1; }
          [ -s "$f" ] || { echo "::error::plaintext dump is missing"; exit 1; }

          gpg --batch --yes --quiet --no-emit-version --no-comments \
              --trust-model always --cipher-algo AES256 \
              --recipient "$RECIPIENT_FPR" --output "$out" --encrypt "$f"

          # Prove the output really is ciphertext for our key before the
          # plaintext goes away.
          [ -s "$out" ] || { echo "::error::encryption produced no output"; exit 1; }
          # --list-only: list the packets without trying to decrypt (there is
          # no private key here, and a decrypt attempt would exit non-zero).
          packets="$(gpg --batch --list-only --list-packets "$out" 2>/dev/null)" \
            || { echo "::error::could not inspect the encrypted output"; exit 1; }
          [ "$(printf '%s\n' "$packets" | grep -c '^:pubkey enc packet:')" = "1" ] \
            || { echo "::error::output must be encrypted to exactly one public key"; exit 1; }
          if grep -aq -e 'CREATE TABLE' -e 'CREATE POLICY' "$out"; then
            echo "::error::ciphertext still contains readable schema text"; exit 1
          fi

          rm -f -- "$f"
          [ ! -e "$f" ] || { echo "::error::plaintext could not be removed"; exit 1; }
          echo "encrypted: $(wc -c < "$out") bytes; plaintext removed"

      - name: Upload encrypted artifact (1 day)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-schema-baseline-encrypted
          path: baseline_raw.sql.gpg
          retention-days: 1
          if-no-files-found: error
